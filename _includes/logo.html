{%- comment -%} Brand logo with a light and a dark variant; CSS shows the one matching the theme. {%- endcomment -%}
<span class="logo{% if include.class %} {{ include.class }}{% endif %}">
  <picture class="logo-on-light">
    <source srcset="{{ '/assets/img/logo.webp' | relative_url }}" type="image/webp">
    <img src="{{ '/assets/img/logo.png' | relative_url }}" alt="{{ include.alt | default: '' }}" width="214" height="132">
  </picture>
  <picture class="logo-on-dark" aria-hidden="true">
    <source srcset="{{ '/assets/img/logo-dark.webp' | relative_url }}" type="image/webp">
    <img src="{{ '/assets/img/logo-dark.png' | relative_url }}" alt="" width="214" height="132">
  </picture>
</span>
