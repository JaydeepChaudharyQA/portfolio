# Projects. Order here = order on the page.
#
#  featured: true   → shown as the large case study at the top (use for one project)
#  type             → Professional | Freelance
#  tags             → used by the filter buttons (must match an id in "filters" below)
#  links            → kind: live | app | repo | info   (repo = GitHub, shows the GitHub icon)

filters:
  - { id: all,         label: All }
  - { id: automation,  label: Automation }
  - { id: government,  label: Government }
  - { id: hospitality, label: Hospitality & Travel }
  - { id: health,      label: Health }
  - { id: edtech,      label: EdTech }

items:
  - title: GALAXY · Cargo Ground Handling System
    featured: true
    type: Professional
    org: Kale Logistics Solutions
    category: Air cargo · Ground handling · Web & mobile
    tags: [automation]
    summary: >-
      Kalé's terminal automation platform for cargo ground handlers. It
      automates export, import and transshipment operations, with real-time
      ULD and inventory tracking, flight build-up and breakdown, paperless
      documents and billing, and is used by ground handlers such as Çelebi
      (Istanbul) and Widerøe (Norway). I built its end-to-end automation
      framework in Playwright + TypeScript.
    contribution: >-
      Automated the import and export cargo scenarios end to end and scaled
      the 4-layer automation framework to cover more end-to-end scenarios. I
      also automated the mobile application with Maestro Studio and Appium.
    layers:
      - { name: Thin test specs,     detail: "readable scenarios, no selectors" }
      - { name: Business workflows,  detail: "import · export · end-to-end flows" }
      - { name: Page objects,        detail: "one class per screen, POM" }
      - { name: Core utilities,      detail: "fixtures · session reuse · test data" }
    metrics:
      - { value: "E2E",  label: import & export scenarios }
      - { value: "4",    label: architecture layers }
      - { value: "2",    label: "platforms: web & mobile" }
    testing: [E2E automation, Regression, Data-driven, Mobile automation]
    tools: [Playwright, TypeScript, Node.js, Maestro, Appium]
    links:
      - { label: Product page, url: "https://www.kalelogistics.com/products/cargo-ground-handling-system", kind: info }

