about:
  heading: Quality is a feature. I test like it.
  paragraphs:
    - >-
      I'm a Manual & Automation QA Engineer with 4+ years of experience testing
      web and mobile applications across logistics, government, EdTech and
      hospitality. I write end-to-end UI automation with Playwright (TypeScript)
      and Selenium WebDriver (Java), mobile automation with Appium and Maestro,
      and API tests with Postman.
    - >-
      I care about frameworks that last: Page Object Model, layered
      architecture, fixtures and centralised test data. I back that up with
      strong manual testing, SQL data validation and clear documentation. I'm
      comfortable in Agile/Scrum teams and with clients, from sprint planning
      through UAT sign-off.
  now:
    title: Currently
    items:
      - Building a Playwright + TypeScript E2E framework for an air-cargo platform at Kale Logistics
      - Expanding automation coverage with AI-assisted testing
      - Learning and implementing CI/CD pipelines for automated test runs
